databases:
  - name: resumate-db
    databaseName: resumate
    user: resumate
    plan: free

services:
  - type: web
    name: resumate-api
    runtime: python
    rootDir: resumate_api
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: resumate-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: CORS_ORIGINS
        value: "*"

  - type: web
    name: resumate-web
    runtime: static
    rootDir: resumate_web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 18.20.4
      - key: VITE_API_BASE_URL
        value: "https://resumate-api.onrender.com"
